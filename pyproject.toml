[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hic-anomaly-pipeline"
version = "0.2.0"
description = "Unsupervised anomaly detection on Hi-C contact maps, cross-referenced with allelic imbalance"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Soo-lab" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pysam>=0.20.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "pre-commit>=3.0",
]

[project.scripts]
hic-anomaly = "hic_anomaly.cli:main"
hic-anomaly-crossref = "hic_anomaly.crossref:main"

[tool.setuptools.packages.find]
include = ["hic_anomaly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
